name: Release Build & Publish

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build-app:
    name: Build App (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: balance_board_app-macos
            target: macos
          - os: windows-latest
            artifact_name: balance_board_app-windows
            target: windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install macOS build tools
        if: matrix.target == 'macos'
        run: brew install automake libtool autoconf

      - name: Extract Tag Version
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          VERSION="${TAG_NAME#v}"
          echo "APP_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "Extracted App Version: ${VERSION}"

      - name: Update App pubspec.yaml Version
        shell: bash
        run: |
          python -c "
          import re, os
          path = 'App/pubspec.yaml'
          ver = os.environ.get('APP_VERSION', '1.0.0')
          run_num = os.environ.get('GITHUB_RUN_NUMBER', '1')
          with open(path, 'r') as f:
              content = f.read()
          content = re.sub(r'^version: .*', f'version: {ver}+{run_num}', content, flags=re.MULTILINE)
          with open(path, 'w') as f:
              f.write(content)
          "

      - name: Install dependencies
        run: flutter pub get
        working-directory: App

      - name: Build macOS Application
        if: matrix.target == 'macos'
        run: flutter build macos --release --build-name=${{ env.APP_VERSION }} --build-number=${{ github.run_number }} --dart-define=APP_VERSION=${{ env.APP_VERSION }}
        working-directory: App

      - name: Package macOS Application
        if: matrix.target == 'macos'
        run: |
          cd App/build/macos/Build/Products/Release
          zip -r "$GITHUB_WORKSPACE/${{ matrix.artifact_name }}.zip" balance_board_app.app

      - name: Build Windows Application
        if: matrix.target == 'windows'
        run: flutter build windows --release --build-name=${{ env.APP_VERSION }} --build-number=${{ github.run_number }} --dart-define=APP_VERSION=${{ env.APP_VERSION }}
        working-directory: App


      - name: Package Windows Application
        if: matrix.target == 'windows'
        shell: powershell
        run: |
          Compress-Archive -Path App/build/windows/x64/runner/Release/* -DestinationPath "$env:GITHUB_WORKSPACE\${{ matrix.artifact_name }}.zip"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.zip
          retention-days: 1

  build-firmware:
    name: Build Firmware (ESP32)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build Firmware
        run: pio run
        working-directory: Firmware

      - name: Package Firmware Binaries
        run: |
          cd Firmware/.pio/build/featheresp32
          cp firmware.bin "$GITHUB_WORKSPACE/balance_board_firmware-featheresp32.bin"
          zip "$GITHUB_WORKSPACE/balance_board_firmware-featheresp32.zip" firmware.bin bootloader.bin partitions.bin

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: balance_board_firmware
          path: |
            balance_board_firmware-featheresp32.bin
            balance_board_firmware-featheresp32.zip
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: [build-app, build-firmware]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            balance_board_app-*.zip
            balance_board_firmware-*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

