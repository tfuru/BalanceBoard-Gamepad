; PlatformIO Project Configuration File for BalanceBoard-Gamepad Firmware

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize

lib_deps =
    bblanchon/ArduinoJson @ ^6.21.6

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DWIIMOTE_VERBOSE=0

[env:featheresp32]
board = featheresp32

[env:freenove_esp32_wrover]
board = freenove_esp32_wrover


